name: Import official Metin2 Wiki catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-metin2-wiki-catalog.mjs"
      - "scripts/import-metin2-wiki-details.mjs"
      - "scripts/parse-metin2-wiki-templates.mjs"
      - "scripts/test-metin2-wiki-template-parser.mjs"
      - "scripts/validate-metin2-wiki-import.mjs"
      - ".github/workflows/import-metin2-wiki-catalog.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build official Wiki category index
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Wiki template parser
        run: node scripts/test-metin2-wiki-template-parser.mjs
      - name: Fetch all pages in official Items category
        run: node scripts/import-metin2-wiki-catalog.mjs
      - name: Extract introductory details for indexed pages
        run: node scripts/import-metin2-wiki-details.mjs
      - name: Parse raw Wiki templates into structured index
        run: node scripts/parse-metin2-wiki-templates.mjs
      - name: Validate imported catalog and page details
        run: node scripts/validate-metin2-wiki-import.mjs
      - name: Commit catalog and details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metin2-wiki-catalog-index.json data/metin2-wiki-page-details.json data/metin2-wiki-structured-index.json data/metin2-wiki-item-database.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Import official Metin2 Wiki item catalog index"
            git pull --rebase origin main
            git push
          fi
