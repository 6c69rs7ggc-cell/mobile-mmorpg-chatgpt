<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10130f"><title>ASHEN REALM — 3D World</title>
<style>
:root{--gold:#e9c878;--glass:rgba(13,17,14,.82);--edge:#b69b594d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11160f;color:#f5f0df;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;justify-content:space-between}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.panel{background:var(--glass);border:1px solid var(--edge);border-radius:13px;padding:10px 12px;box-shadow:0 8px 24px #0007;backdrop-filter:blur(8px)}.brand{font-size:11px;letter-spacing:2.4px;color:var(--gold);font-weight:900}.name{font-size:15px;font-weight:850;margin-top:3px}.sub{font-size:11px;color:#c3c5b7}.bar{height:7px;background:#35392f;border-radius:8px;overflow:hidden;margin-top:6px;width:min(39vw,180px)}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#842b2d,#e75b55)}.xp{background:linear-gradient(90deg,#92702d,#f4d36f)}.stat{font-size:11px;font-weight:800;margin-top:5px}.objective{position:absolute;top:104px;left:50%;transform:translateX(-50%);max-width:78vw;text-align:center;white-space:nowrap;font-size:11px;color:#eee3c3}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.stick{width:124px;height:124px;border:1px solid #ffffff3c;border-radius:50%;background:#0c100c99;position:relative;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 25px #0008}.nub{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(#d9c78f,#8b7543);border:2px solid #f2e4b5;box-shadow:0 4px 14px #0009}.buttons{display:grid;grid-template-columns:repeat(2,62px);gap:8px;pointer-events:auto}.btn{height:58px;border-radius:50%;border:1px solid #e9c87888;background:linear-gradient(145deg,#343a2cdd,#121711ed);color:#f4e6b9;font-size:10px;font-weight:900;box-shadow:0 5px 16px #0008;touch-action:manipulation}.btn:active{transform:scale(.94);background:#66552c}.btn.attack{background:linear-gradient(145deg,#8e3229,#3d1715);border-color:#ef8271;font-size:12px}.side{display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto}.pill{border:1px solid var(--edge);background:var(--glass);color:#eee4c6;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:900;font-size:18px;text-align:center;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .2s;max-width:80vw}.toast.show{opacity:1}.hint{font-size:10px;color:#c9c5b3;text-align:center;margin-top:5px}@media(min-width:800px){.stick{width:138px;height:138px}.buttons{grid-template-columns:repeat(2,70px)}.btn{height:64px}.objective{top:115px}}
</style></head>
<body><div id="hud">
<div class="row"><div class="panel"><div class="brand">ASHEN REALM / 3D</div><div class="name">Pútnik Popola <span id="level">Lv. 1</span></div><div class="bar"><div class="fill hp" id="hpbar"></div></div><div class="stat" id="hptext">HP 100 / 100</div><div class="bar"><div class="fill xp" id="xpbar" style="width:0%"></div></div><div class="sub" id="xptext">XP 0 / 100</div></div><div class="panel" style="text-align:right"><div class="brand">ÚDOLIE POPOLA</div><div class="name" id="gold">◈ 0</div><div class="sub" id="kills">Porazení: 0</div><div class="sub" id="weapon">Železný meč +0</div></div></div>
<div class="objective panel" id="quest">Úloha: Poraz 5 Tieňových vlkov <b id="qcount">0/5</b></div><div class="toast" id="toast"></div>
<div class="bottom"><div><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="hint">POHYB</div></div><div class="side"><button class="pill" id="camera">KAMERA ↻</button><button class="pill" id="sound">ZVUK: VYP</button><div class="buttons"><button class="btn" id="potion">LEKTVAR<br>Q · 3</button><button class="btn" id="skill">VÝPAD<br>E</button><button class="btn attack" id="attack">ÚTOK<br>⚔</button><button class="btn" id="target">CIEĽ<br>LOCK</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let scene,camera,renderer,clock,player,ground,enemyGroup,trees=[],enemies=[],drops=[],particles=[],keys={},move={x:0,y:0},camAngle=0,attackCd=0,skillCd=0,potion=3,gold=0,kills=0,xp=0,level=1,hp=100,maxHp=100,weapon=0,target=null,toastTimer=0,locked=false,started=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mat(color,rough=.9,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
const M={grass:mat(0x303e2a),darkgrass:mat(0x263523),stone:mat(0x626253),bark:mat(0x43372a),leaf:mat(0x30452c),leaf2:mat(0x45533a),steel:mat(0x9aa5a3,.35,.65),dark:mat(0x242b2a),cloth:mat(0x51433a),red:mat(0x772c2a),skin:mat(0xc49c75),gold:mat(0xd7b65e,.4,.5),eye:mat(0xf2c77b,.3),wolf:mat(0x3e4641),wolfDark:mat(0x202724),glow:mat(0xc15a34,.3,.1),white:mat(0xe8e0c9)};
function box(parent,geo,material,x,y,z,sx=1,sy=1,sz=1){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function makeTree(x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);box(g,new THREE.CylinderGeometry(.18,.32,2.4,7),M.bark,0,1.2,0);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.05-i*.16,1.8,7),i===1?M.leaf2:M.leaf);c.position.set(0,2.25+i*.65,0);c.castShadow=true;g.add(c)}scene.add(g);trees.push(g)}
function makeHero(){const g=new THREE.Group();const body=box(g,new THREE.CapsuleGeometry(.34,.55,4,8),M.cloth,0,1.15,0);body.rotation.z=-.04;box(g,new THREE.SphereGeometry(.29,10,8),M.skin,0,1.85,0,1,1.12,.95);box(g,new THREE.ConeGeometry(.32,.48,7),M.dark,0,2.15,0);box(g,new THREE.BoxGeometry(.43,.11,.38),M.gold,0,1.38,0);for(const s of [-1,1]){box(g,new THREE.CapsuleGeometry(.11,.52,3,6),M.cloth,s*.42,1.16,0).rotation.z=s*.12;box(g,new THREE.CapsuleGeometry(.13,.48,3,6),M.dark,s*.18,.42,0);box(g,new THREE.SphereGeometry(.13,8,6),M.dark,s*.18,.18,0)}const sword=new THREE.Group();box(sword,new THREE.BoxGeometry(.08,.9,.13),M.steel,0,.42,0);box(sword,new THREE.BoxGeometry(.36,.07,.18),M.gold,0,.03,0);box(sword,new THREE.CylinderGeometry(.055,.06,.3,6),M.bark,0,-.16,0);sword.position.set(.47,1.15,-.03);sword.rotation.z=-.35;g.add(sword);g.userData.sword=sword;scene.add(g);return g}
function makeWolf(x,z,i){const g=new THREE.Group();g.position.set(x,0,z);g.userData={hp:45+level*8,max:45+level*8,alive:true,attack:0,hit:0,speed:1.1+Math.random()*.35,id:i};box(g,new THREE.BoxGeometry(.7,.48,1.15),M.wolf,0,.58,0);box(g,new THREE.SphereGeometry(.31,9,7),M.wolf,-.02,.78,-.58,1,1,.9);box(g,new THREE.ConeGeometry(.11,.28,5),M.wolfDark,-.22,1.02,-.65).rotation.z=-.2;box(g,new THREE.ConeGeometry(.11,.28,5),M.wolfDark,.18,1.02,-.65).rotation.z=.2;box(g,new THREE.SphereGeometry(.055,6,5),M.eye,-.13,.82,-.84);box(g,new THREE.SphereGeometry(.055,6,5),M.eye,.1,.82,-.84);for(const s of [-1,1])for(const zoff of [-.36,.34])box(g,new THREE.CylinderGeometry(.08,.1,.45,6),M.wolfDark,s*.22,.26,zoff);scene.add(g);const bar=new THREE.Group();const bg=new THREE.Mesh(new THREE.PlaneGeometry(1.05,.09),mat(0x251a19));bg.position.y=1.35;bar.add(bg);const fg=new THREE.Mesh(new THREE.PlaneGeometry(1,.055),mat(0xd64c42));fg.position.set(0,1.35,.008);bar.add(fg);g.add(bar);g.userData.bar=fg;enemies.push(g);return g}
function spawnEnemies(){for(const e of enemies)scene.remove(e);enemies=[];for(let i=0;i<12;i++){const a=i*Math.PI*2/12+Math.random()*.2,r=7+Math.random()*13;makeWolf(Math.cos(a)*r,Math.sin(a)*r,i)}}
function makeDrop(pos,amount){const g=new THREE.Group();const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.23),M.gold);gem.position.y=.35;g.add(gem);const light=new THREE.PointLight(0xd8a747,1.2,3);light.position.y=.5;g.add(light);g.position.copy(pos);g.userData={amount,phase:Math.random()*6};scene.add(g);drops.push(g)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87918b);scene.fog=new THREE.FogExp2(0x87918b,.018);scene.add(new THREE.HemisphereLight(0xdde5e7,0x343a26,2));const sun=new THREE.DirectionalLight(0xffe5ba,2.3);sun.position.set(-12,24,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150,1,1),M.grass);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(120,60,0x64705a,0x46513d);grid.position.y=.015;grid.material.transparent=true;grid.material.opacity=.12;scene.add(grid);for(let i=0;i<95;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)<9)continue;makeTree(x,z,.65+Math.random()*.85)}for(let i=0;i<28;i++){const x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.hypot(x,z)<7)continue;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.4+Math.random()*.8,0),M.stone);s.position.set(x,.25,z);s.rotation.set(Math.random(),Math.random(),Math.random());s.castShadow=true;s.receiveShadow=true;scene.add(s)}const ruin=new THREE.Group();for(let i=0;i<7;i++){const a=i/7*Math.PI*2;box(ruin,new THREE.BoxGeometry(.7,2.6,.8),M.stone,Math.cos(a)*3,1.3,Math.sin(a)*3);box(ruin,new THREE.BoxGeometry(.9,.22,.95),M.dark,Math.cos(a)*3,2.65,Math.sin(a)*3)}ruin.position.set(-5,0,-5);scene.add(ruin);player=makeHero();enemyGroup=new THREE.Group();scene.add(enemyGroup);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);camera.position.set(0,5,8);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);clock=new THREE.Clock();spawnEnemies();resize();started=true;toast('Vitaj v Údolí popola');loop()}
function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTimer=2.2}
function updateHud(){$('level').textContent='Lv. '+level;$('hpbar').style.width=(hp/maxHp*100)+'%';$('hptext').textContent='HP '+Math.ceil(hp)+' / '+maxHp;$('xpbar').style.width=(xp/(level*100)*100)+'%';$('xptext').textContent='XP '+xp+' / '+level*100;$('gold').textContent='◈ '+gold;$('kills').textContent='Porazení: '+kills;$('weapon').textContent='Železný meč +'+weapon;$('potion').innerHTML='LEKTVAR<br>Q · '+potion;$('qcount').textContent=Math.min(5,kills)+'/5'}
function attack(){if(attackCd>0)return;attackCd=.58;player.userData.sword.rotation.z=-1.5;setTimeout(()=>{if(player)player.userData.sword.rotation.z=-.35},160);let candidates=enemies.filter(e=>e.userData.alive&&player.position.distanceTo(e.position)<3.25).sort((a,b)=>player.position.distanceTo(a.position)-player.position.distanceTo(b.position));if(locked&&target&&target.userData.alive&&candidates.includes(target))candidates=[target,...candidates.filter(e=>e!==target)];if(!candidates.length){toast('Príliš ďaleko — priblíž sa');return}const e=candidates[0];e.userData.hp-=22+weapon*11;e.userData.hit=.18;e.position.x+=Math.sign(e.position.x-player.position.x)*.35;e.position.z+=Math.sign(e.position.z-player.position.z)*.35;const ratio=clamp(e.userData.hp/e.userData.max,0,1);e.userData.bar.scale.x=ratio;e.userData.bar.position.x=-(1-ratio)*.5;burst(e.position,0xc7b56b,7);if(e.userData.hp<=0){e.userData.alive=false;scene.remove(e);kills++;gold+=8+Math.floor(Math.random()*12);xp+=35;makeDrop(e.position.clone(),12+Math.floor(Math.random()*20));toast('Vlčí tieň porazený  +XP  +zlato');if(kills%5===0){level++;maxHp+=12;hp=maxHp;toast('ÚROVEŇ '+level+' — sila rastie!')}if(kills>=5&&kills%5===0)toast('Úloha splnená! Pokračuj v love');if(enemies.filter(a=>a.userData.alive).length<4)setTimeout(()=>{if(started)for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,r=13+Math.random()*9;makeWolf(player.position.x+Math.cos(a)*r,player.position.z+Math.sin(a)*r,Date.now()+i)}},1200)}updateHud()}
function burst(pos,color,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.055,5,4),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);m.position.y+=.8;m.userData={v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*3,(Math.random()-.5)*3),life:.4+Math.random()*.35};scene.add(m);particles.push(m)}}
function useSkill(){if(skillCd>0)return;skillCd=4;const a=enemies.filter(e=>e.userData.alive&&player.position.distanceTo(e.position)<5);if(!a.length){toast('Výpad: nepriateľ je ďaleko');return}for(const e of a){e.userData.hp-=38+weapon*12;burst(e.position,0xe18d42,8);if(e.userData.hp<=0){e.userData.alive=false;scene.remove(e);kills++;gold+=12;xp+=45;makeDrop(e.position.clone(),15)}else{const r=clamp(e.userData.hp/e.userData.max,0,1);e.userData.bar.scale.x=r;e.userData.bar.position.x=-(1-r)*.5}}toast('PLAMENNÝ VÝPAD!');updateHud()}
function drink(){if(!potion){toast('Nemáš liečivé lektvary');return}if(hp===maxHp){toast('Životy sú plné');return}potion--;hp=Math.min(maxHp,hp+45);burst(player.position,0x5abf80,12);toast('Lektvar +45 HP');updateHud()}
function targetNext(){const alive=enemies.filter(e=>e.userData.alive).sort((a,b)=>player.position.distanceTo(a.position)-player.position.distanceTo(b.position));target=alive[0]||null;locked=!!target;toast(target?'Cieľ uzamknutý':'Žiadny cieľ');}
function update(dt){attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}let ix=move.x,iz=move.y;if(keys.KeyW||keys.ArrowUp)iz-=1;if(keys.KeyS||keys.ArrowDown)iz+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}if(len>.06){const dx=ix*Math.cos(camAngle)+iz*Math.sin(camAngle),dz=-ix*Math.sin(camAngle)+iz*Math.cos(camAngle);player.position.x+=dx*5.2*dt;player.position.z+=dz*5.2*dt;player.rotation.y=Math.atan2(dx,dz);player.position.x=clamp(player.position.x,-65,65);player.position.z=clamp(player.position.z,-65,65)}for(const e of enemies){if(!e.userData.alive)continue;const d=e.position.distanceTo(player.position);if(e.userData.hit>0)e.userData.hit-=dt;if(d<15&&d>1.25){const dx=(player.position.x-e.position.x)/d,dz=(player.position.z-e.position.z)/d;e.position.x+=dx*e.userData.speed*dt;e.position.z+=dz*e.userData.speed*dt;e.rotation.y=Math.atan2(dx,dz)}if(d<1.5){e.userData.attack-=dt;if(e.userData.attack<=0){e.userData.attack=1.4;hp=Math.max(0,hp-(5+level));updateHud();if(hp<=0){hp=maxHp;player.position.set(0,0,0);toast('Padol si — vrátil si sa k ohnisku')}}}}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.rotation.y+=dt*1.4;d.position.y=.08+Math.sin(clock.elapsedTime*3+d.userData.phase)*.12;if(d.position.distanceTo(player.position)<1.45){gold+=d.userData.amount;scene.remove(d);drops.splice(i,1);toast('Získal si '+d.userData.amount+' zlata');updateHud()}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=7*dt;p.userData.life-=dt;if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}}
function loop(){requestAnimationFrame(loop);if(!started)return;const dt=Math.min(clock.getDelta(),.04);update(dt);const dist=7.5,up=4.2;const desired=new THREE.Vector3(player.position.x+Math.sin(camAngle)*dist,player.position.y+up,player.position.z+Math.cos(camAngle)*dist);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.1,player.position.z);renderer.render(scene,camera)}
const stick=$('stick'),nub=$('nub');let pointer=null;function setStick(ev){const r=stick.getBoundingClientRect(),dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2),max=r.width*.34,d=Math.hypot(dx,dy),k=Math.min(1,max/(d||1));move.x=dx*k/max;move.y=dy*k/max;nub.style.left='calc(50% + '+dx*k+'px)';nub.style.top='calc(50% + '+dy*k+'px')}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)setStick(e)});function release(e){if(pointer===e.pointerId){pointer=null;move={x:0,y:0};nub.style.left='50%';nub.style.top='50%'}}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
$('attack').addEventListener('click',attack);$('skill').addEventListener('click',useSkill);$('potion').addEventListener('click',drink);$('target').addEventListener('click',targetNext);$('camera').addEventListener('click',()=>{camAngle+=Math.PI/4;toast('Kamera otočená')});$('sound').addEventListener('click',()=>toast('Zvukové efekty budú doplnené v ďalšej verzii'));window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();attack()}if(e.code==='KeyE')useSkill();if(e.code==='KeyQ')drink();if(e.code==='KeyT')targetNext()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('resize',resize);document.addEventListener('contextmenu',e=>e.preventDefault());init();updateHud();
})();
</script></body></html>
