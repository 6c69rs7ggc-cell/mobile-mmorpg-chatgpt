name: Metin2 Godot asset-independent smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metin2-godot-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout upstream candidate into isolated folder
        uses: actions/checkout@v4
        with:
          repository: EnriqueGF/metin2-godot
          ref: 078d39a41a3ef17c9e09fb9807956cb1a2f16641
          path: upstream/metin2-godot
          persist-credentials: false

      - name: Record upstream revision
        working-directory: upstream/metin2-godot
        run: git rev-parse HEAD

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Import and parse project without proprietary assets
        working-directory: upstream/metin2-godot
        run: godot --headless --editor --path godot --quit

      - name: Run asset-independent client controls smoke test
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot -- --role=client --client-controls-sandbox --smoke-test --expect-role=client

      - name: Run server foundation tests without map assets
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot --script res://server/tests/run_server_foundation_tests.gd

      - name: Run gameplay domain tests
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot --script res://server/tests/run_gameplay_domain_tests.gd

      - name: Run authoritative coordinator tests when map manifests are available
        working-directory: upstream/metin2-godot
        run: |
          if [ -f generated/maps/metin2_map_a1/server_content_manifest.json ] && [ -f generated/maps/metin2_map_a1/collision_manifest.json ]; then
            godot --headless --path godot --script res://server/tests/run_authoritative_game_coordinator_tests.gd
          else
            echo "::warning::Authoritative coordinator tests skipped: audited city content and collision manifests are absent. These tests require local generated map data."
          fi

      - name: Run ENet session tests
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot --script res://server/tests/run_enet_session_tests.gd

      - name: Run ENet gameplay gateway tests
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot --script res://server/tests/run_enet_gameplay_gateway_tests.gd

      - name: Run aggregate persistence tests
        working-directory: upstream/metin2-godot
        run: godot --headless --path godot --script res://server/tests/aggregate_repository_test_runner.gd

      - name: Check whether generated map data is present
        working-directory: upstream/metin2-godot
        run: |
          if [ -d generated/maps ] && [ "$(find generated/maps -type f | wc -l)" -gt 0 ]; then
            echo "Generated map data exists; run the authoritative server smoke test."
            godot --headless --path godot -- --smoke-test --expect-role=server
          else
            echo "::warning::Server runtime smoke test not run: generated/maps is absent. Domain, persistence and transport tests run separately above, but real map-backed server startup remains unverified."
          fi
